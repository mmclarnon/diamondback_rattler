services:
  postgres:
    image: postgres:14
    container_name: msf_postgres
    environment:
      POSTGRES_USER: msf
      POSTGRES_PASSWORD: msfpassword
      POSTGRES_DB: msf
    ports:
      - "5432:5432"
    volumes:
      - /home/sysadmin/workspace/diamondback_rattler/docker/pgdata:/var/lib/postgresql/data

  metasploit:
    image: metasploitframework/metasploit-framework:latest
    container_name: metasploit
    depends_on:
      - postgres
    ports:
      - "55553:55553"   # msfrpcd RPC port
      - "5555:5555"     # example listener port
      - "6666:6666"
    command: >
      /usr/src/metasploit-framework/msfrpcd
      -U msf
      -P msfpassword
      -a 0.0.0.0
      -p 55553
      -f   # foreground mode
    volumes:
      - /home/sysadmin/workspace/diamondback_rattler/docker/data:/root/.msf4
      - /home/sysadmin/workspace/diamondback_rattler/docker/payloads:/payloads
