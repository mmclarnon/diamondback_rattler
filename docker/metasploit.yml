services:
  postgres:
    image: postgres:14
    container_name: msf_postgres
    environment:
      POSTGRES_USER: msf
      POSTGRES_PASSWORD: msfpassword
      POSTGRES_DB: msf
    ports:
      - "5432:5432"
    volumes:
      - /home/sysadmin/workspace/diamondback_rattler/docker/pgdata:/var/lib/postgresql/data

  metasploit:
    image: metasploitframework/metasploit-framework:latest
    container_name: metasploit
    tty: true
    stdin_open: true
    depends_on:
      - postgres
    ports:
      - "55553:55553"   # msfrpcd default port
      - "5555:5555"     # Meterpreter listener port
      - "6666:6666"     # Another Meterpreter listener port
    environment:
      MSF_DATABASE_CONFIG: /root/.msf4/database.yml
    command: >
      sh -c "cat <<EOF > /root/.msf4/database.yml
      production:
        adapter: postgresql
        database: msf
        username: msf
        password: msfpassword
        host: msf_postgres
        port: 5432
        pool: 5
        timeout: 5
      EOF
      && msfrpcd -U msf -P msfpassword -a 0.0.0.0 -p 55553 -S"
    volumes:
      - /home/sysadmin/workspace/diamondback_rattler/docker/data:/root/.msf4
      - /home/sysadmin/workspace/diamondback_rattler/docker/payloads:/payloads   # Host directory for msfvenom output
