services:
  ms:
    image: metasploitframework/metasploit-framework:latest
    environment:
      # This connects Metasploit to the 'db' service
      DATABASE_URL: postgres://postgres@db:5432/msf?pool=200&timeout=5
    links:
      - db
    ports:
      # Map container port 4444 to host port 4444
      - "4444:4445"
    volumes:
      # Persist Metasploit data (configs, logs, etc.) to your local home directory
      - $HOME/.msf4:/home/msf/.msf4
    command: ["msfconsole", "-q"] # Start msfconsole quietly on container start

  db:
    image: postgres:17.7-alpine3.21 # Using a specific version of Alpine Postgres for stability
    volumes:
      # Persist the database data
      - pg_data:/var/lib/postgresql/data
    environment:
      # Simplified authentication for a local, contained environment
      POSTGRES_HOST_AUTH_METHOD: trust
volumes:
  pg_data:
    driver: local
