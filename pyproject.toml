[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "diamondback"
version = "0.0.66"
description = "DiamondB@ck is a Teaching Platform for CyberSecurity Students."
authors = [
    { name = "Catalyst Prime", email = "mark@catalystprime.io" },
]
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]