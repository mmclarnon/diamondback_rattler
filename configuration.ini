[general]
dir = /usr/local/bin
serial = 1114533950505869
base_increment = 2048

[security]
encryption_key = diamondback.key
username = sysadmin
password = 4tvHCuJnxc4/p7krlPeo6Ar7Gaw3if6lrZ48YmgdiOsxw2AeO8JVOBi7sj2P+P4rb8yNDLbe

[database]
type = sqlite
url = diamondback.sqlite

[api]
status = /api/system/ping

[execution]
wait = 30
config_check = 30
speak = true
ignore = 10.0.0.1,10.0.10.1,10.0.0.4,10.0.0.101,10.0.10.40

[server]
last = 192.168.1.1
username = sysadmin

[piper]
home = ./data
voice = en_US-amy-medium.onnx

[loggers]
keys = root,my_app,support

[logger_root]
level = DEBUG
handlers = console

[logger_support]
level = DEBUG
handlers = console,file_handler
qualname = support
propagate = 0

[logger_my_app]
level = DEBUG
handlers = file_handler,console
qualname = diamondback
propagate = 0

[handlers]
keys = console,file_handler

[handler_console]
class = StreamHandler
level = INFO
formatter = detailed_formatter
args = (sys.stdout,)

[handler_file_handler]
class = handlers.RotatingFileHandler
level = DEBUG
formatter = detailed_formatter
args = ('diamondback.log', 'a', 10485760, 5)

[formatters]
keys = simple_formatter,detailed_formatter

[formatter_simple_formatter]
format = %(levelname)s: %(message)s

[formatter_detailed_formatter]
format = %(asctime)s - [%(module)s:%(levelname)s] [%(filename)s:%(lineno)d] - %(message)s
datefmt = %Y-%m-%d %H:%M:%S

